<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Good Morning Jaan ❤️</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #fff0c9);
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .card {
            background: rgba(255,255,255,0.85);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            animation: pop 1.5s ease;
        }

        h1 {
            color: #e91e63;
            font-size: 32px;
        }

        h2 {
            color: #d84315;
            font-size: 27px;
        }

        p {
            color: #555;
            font-size: 19px;
        }

        .heart {
            font-size: 45px;
            animation: beat 1s infinite;
        }

        @keyframes beat {
            50% {
                transform: scale(1.25);
            }
        }

        @keyframes pop {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="heart">❤️</div>

        <h2>🙏 Radhe Radhe 🙏</h2>

        <h1>Good Morning Jaan ❤️</h1>

        <p>
            Tumhari subah Radha Rani ki kripa se<br>
            bahut hi beautiful aur khushiyon se bhari ho 🌸
        </p>

        <p>
            Have a Lovely Day, Meri Jaan 💕
        </p>

    </div>

</body>
</html>
